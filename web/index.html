<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocsTools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DocsTools</h1>
    <div class="controls">
      <input
        id="search-input"
        type="search"
        placeholder="add months to a date…"
        autocomplete="off"
        aria-label="Rechercher une méthode .NET"
      />
      <select id="version-select" aria-label="Filtrer par version .NET">
        <option value="">Toutes les versions</option>
      </select>
    </div>
  </header>
  <main>
    <ul id="results" aria-live="polite"></ul>
    <section id="detail" aria-live="polite">
      <p class="detail-placeholder">Sélectionnez un résultat pour voir le détail.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
