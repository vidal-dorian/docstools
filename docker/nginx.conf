server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sans en-tête explicite, le navigateur et Cloudflare peuvent conserver
    # une version périmée de style.css/app.js en cache après un déploiement
    # (watchtower, US-053) sans purge manuelle. no-cache ne désactive pas le
    # cache : il force juste une revalidation (ETag) à chaque visite plutôt
    # que de servir silencieusement une ancienne version.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
