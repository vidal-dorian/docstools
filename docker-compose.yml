# Déploiement DocsTools (US-050, US-053). Voir docs/specification.md §8
# et docs/deploiement.md pour la procédure complète.
#
# index.sqlite est produit hors compose par le build (ingest/), ~1×/an.
# Monté en lecture seule : aucun volume en écriture n'est requis pour le
# service. cloudflared est l'unique point d'entrée public (aucun port n'est
# publié sur l'hôte) — voir docs/deploiement.md pour la configuration
# initiale du tunnel (CLOUDFLARE_TUNNEL_TOKEN, à placer dans un .env local,
# jamais commité).

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    volumes:
      - ./index.sqlite:/data/index.sqlite:ro
    environment:
      DOCSTOOLS_DB_PATH: /data/index.sqlite
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN manquant — voir docs/deploiement.md}
    depends_on:
      - web
    restart: unless-stopped
