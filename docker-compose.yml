# Déploiement DocsTools (US-050). Voir docs/specification.md, section 8.
#
# index.sqlite est produit hors compose par le build (ingest/), ~1×/an —
# voir docs/deploiement.md (US-052). Monté en lecture seule : aucun volume
# en écriture n'est requis pour le service.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    volumes:
      - ./index.sqlite:/data/index.sqlite:ro
    environment:
      DOCSTOOLS_DB_PATH: /data/index.sqlite
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
